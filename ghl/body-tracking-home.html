// Variable para almacenar la posición de scroll anterior
var lastScrollPos = 0;

$(window).on('scroll', function() {
    var scrollPos = $(window).scrollTop();
    var windowHeight = $(window).innerHeight();

    // ----------------------------------------------------
    // --- NUEVA LÓGICA DE DIRECCIÓN DEL SCROLL (Scroll Down/Up) ---
    // ----------------------------------------------------
    
    // Si la posición de scroll actual (scrollPos) es mayor que la posición anterior (lastScrollPos) 
    // Y (&&) si el scroll ya ha bajado un poco (p.ej., más de 5 píxeles) para evitar cambios bruscos al inicio.
    // Usamos 0 como umbral para simplicidad, pero se recomienda un pequeño valor para "debounce".
    if (scrollPos > lastScrollPos && scrollPos > 5) {
        // Scroll hacia ABAJO
        // Añadir la clase .arriba2 al .header
        $('.header').addClass('arriba2');
    } else if (scrollPos < lastScrollPos) {
        // Scroll hacia ARRIBA
        // Quitar la clase .arriba2 del .header
        $('.header').removeClass('arriba2');
    }
    
    // Actualizar la posición de scroll anterior para el siguiente evento
    lastScrollPos = scrollPos;
    
    // ----------------------------------------------------
    // --- Lógica del .loader (EXISTENTE) ---
    // ----------------------------------------------------
    
    if (scrollPos > windowHeight) {
        $('.loader').css('z-index', '0');
    } else {
        $('.loader').css('z-index', '2');
    }
    
    // ----------------------------------------------------
    // --- Lógica de clase .trans (UMBRAL DINÁMICO) (EXISTENTE) ---
    // ----------------------------------------------------
    // NOTA: Recuerda que la variable 'dynamicThreshold' debe estar definida en el scope exterior.
    var threshold = dynamicThreshold; 

    if (scrollPos > threshold) {
        // Si el scroll pasa del umbral, quita la clase .trans
        $('.header').removeClass('trans');
    } else {
        // Si el scroll está en el umbral o menos, vuelve a agregar la clase .trans
        $('.header').addClass('trans');
    }
});

// ------------------------------------------------------------------
// --- NUEVA LÓGICA DE CÁLCULO DINÁMICO (FUERA del evento scroll) ---
// ------------------------------------------------------------------

var dynamicThreshold = 0; // Variable global para almacenar el umbral en píxeles

function calcularUmbralDinamico() {
    // 1. Calcular 100svh en píxeles (usando un div temporal)
    var tempSvh = $('<div>').css({
        'height': '100svh',
        'width': '1px',
        'position': 'fixed',
        'top': '-9999px',
        'visibility': 'hidden'
    }).appendTo('body');
    var alturaSvh = tempSvh.height();
    tempSvh.remove();

    // 2. Calcular 3.26em en píxeles (usando otro div temporal)
    var tempEm = $('<div>').css({
        'height': '3.26em',
        'width': '1px',
        'position': 'fixed',
        'top': '-9999px',
        'visibility': 'hidden'
    }).appendTo('body');
    var alturaEm = tempEm.height();
    tempEm.remove();

    // 3. Calcular el Umbral Final (100svh - 3.26em)
    dynamicThreshold = Math.max(0, alturaSvh - alturaEm);
}

// -----------------------------------
// --- EJECUCIÓN INICIAL Y RESIZE ---
// -----------------------------------

// 1. Calcular el umbral la primera vez que la página carga
$(document).ready(function() {
    calcularUmbralDinamico();
    // Ejecutar el manejo del scroll una vez para aplicar la clase
    $(window).trigger('scroll'); 
});


// 2. Recalcular el umbral cada vez que la ventana cambie de tamaño
$(window).on('resize', function() {
    calcularUmbralDinamico();
    // Ejecutar el manejo del scroll para que la clase se actualice
    $(window).trigger('scroll');
});

$(document).ready(function() {
    if (sessionStorage.getItem('loaded')) {
        // Si existe, la página ya fue cargada en esta sesión, simplemente registra el mensaje.
        $('.logo-ani').addClass('loader-run');
        $('.header').addClass('trans');
        var video = $('.loader-video video')[0];
      	if (video) {
        	video.play();
	      }
    } else {
        // Si NO existe, es la primera carga de la página en esta sesión, ejecuta la lógica del loader.
        
        // Establecer la variable de sesión para que el código no se ejecute en la siguiente recarga.
        sessionStorage.setItem('loaded', 'true');
        
        // Lógica de inicio del Loader
        $('body').css({ 'overflow': 'hidden', 'height': '100svh' });
        $('.loader-rojo').addClass('seve');
        $('.loader').addClass('es-sticky');
        $('.header').addClass('trans');
        $('.header').addClass('arriba');

        setTimeout(function() {
            $('.logo-ani').addClass('loader-run');
        }, 1000);

        setTimeout(function() {
            var video = $('.loader-video video')[0];
            if (video) {
                video.play();
            }
            $('.loader-rojo').removeClass('seve');
        }, 2000);

        setTimeout(function() {
            $('body').css({ 'overflow': 'initial', 'height': 'auto' });
            $('.header').removeClass('arriba');
        }, 3000);
    }
    
    $('#abrir-sub').on('click', function(e) {
        // Previene el comportamiento por defecto del enlace (si es un <a>)
        e.preventDefault(); 
        
        // Al elemento con clase '.suscribe', agrégale la clase '.abierto'
        $('.suscribe').addClass('abierto');
    });
    
    $('#cerrar-sub').on('click', function(e) {
    		e.preventDefault(); 
        $('.suscribe').removeClass('abierto');
    });
    
    $('.web-sup').addClass('ya-cargo');

        console.log('Imagen de Shoyu Ramen precargada correctamente.');
    });

    $(img).on('error', function() {
        console.error('Error al precargar la imagen.');
    });
});
</script>
