$('footer.footer').addClass('es-sticky');
$('.txt-pie-desple').removeClass('seve');
$('.pie-sin-linea').on('click', function() {
    var $linkWrapper = $(this).closest('.pie-link-wrapper');

    // Si el elemento clicado ya está abierto, ciérralo.
    if ($linkWrapper.hasClass('abierto')) {
        $linkWrapper.removeClass('abierto');
    } else {
        // De lo contrario, cierra cualquier otro y abre este.
        $('.pie-link-wrapper').removeClass('abierto');
        $linkWrapper.addClass('abierto');
    }
});
$('.abre-menu').on('click', function() {

});

	$('.menu-prin').removeClass('abierto');

});
