document.addEventListener('DOMContentLoaded', function () {
  var trigger = document.getElementById('abrir-orden');
  var closeBtn = document.getElementById('cerrar-orden');
  var fondo = document.getElementById('cerrar-orden-fondo');
  var wrapper = document.getElementById('orden-panel-wrapper');
  if (!trigger || !wrapper) return;

  function openOrden(e) {
    if (e) e.preventDefault();
    wrapper.style.display = 'flex';
    requestAnimationFrame(function () {
      wrapper.classList.add('abierto');
    });
  }

  function closeOrden(e) {
    if (e) e.preventDefault();
    wrapper.classList.remove('abierto');
    setTimeout(function () {
      wrapper.style.display = 'none';
    }, 300);
  }

  trigger.addEventListener('click', openOrden);
  if (closeBtn) closeBtn.addEventListener('click', closeOrden);
  if (fondo) fondo.addEventListener('click', closeOrden);
});
</script>
