<style>
:root {
  --cream: #fff6ea;
  --red: #bd2025;
  --red-25: rgba(189, 32, 37, .25);
  --cream-25: rgba(255, 246, 234, .25);
  --gap: 1.5rem;
  --maxw: 1200px;
}

* { box-sizing: border-box; }

@font-face {
  font-family: "Altpicaro Official";
  src: url("https://cdn.prod.website-files.com/68baa907f46485600e606eb9/68f84fae25a305cd0c5d3222_ALTPicaro-Regular.woff") format("woff");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background-color: var(--cream);
  color: var(--red);
  font-family: "Altpicaro Official", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.4;
}

img { max-width: 100%; display: block; }

a { color: inherit; text-decoration: none; }

h1, h2, h3, h4 { margin: 0; font-weight: 400; }

p { margin: 0 0 .75em; }

.slurp-container {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 1.5rem;
}

.slurp-visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ---------- Header / Nav ---------- */
.slurp-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background-color: var(--cream);
  border-bottom: 1px solid var(--red-25);
}

.slurp-header-inner {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 1rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.slurp-logo {
  font-size: 1.4rem;
  letter-spacing: .04em;
  text-transform: uppercase;
  flex: none;
}

.slurp-nav {
  display: flex;
  align-items: center;
  gap: 1.75rem;
  flex-wrap: wrap;
}

.slurp-nav a {
  font-size: .95rem;
  letter-spacing: .02em;
  white-space: nowrap;
  border-bottom: 1px solid transparent;
  transition: border-color .2s ease;
}

.slurp-nav a:hover { border-color: var(--red); }

.slurp-nav-toggle {
  display: none;
  background: none;
  border: 0;
  cursor: pointer;
  color: var(--red);
  font-family: inherit;
  font-size: .95rem;
  padding: .4em .2em;
}

.slurp-nav-close {
  display: none;
}

@media (max-width: 860px) {
  .slurp-nav {
    display: none;
    position: fixed;
    inset: 0;
    top: 0;
    background-color: var(--cream);
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 2rem;
    z-index: 99;
  }
  .slurp-nav.is-open { display: flex; }
  .slurp-nav a { font-size: 1.4rem; }
  .slurp-nav-toggle { display: block; }
  .slurp-nav-close {
    display: none;
    position: fixed;
    top: 1.1rem;
    right: 1.5rem;
    z-index: 101;
    background: none;
    border: 0;
    cursor: pointer;
    color: var(--red);
    font-family: inherit;
    font-size: .95rem;
  }
  .slurp-nav.is-open ~ .slurp-nav-close,
  .slurp-nav-close.is-open { display: block; }
}

/* ---------- Hero ---------- */
.slurp-hero {
  position: relative;
  min-height: 88vh;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
  color: var(--cream);
}

.slurp-hero video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}

.slurp-hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.05) 0%, rgba(0,0,0,.35) 100%);
  z-index: 1;
}

.slurp-hero-content {
  position: relative;
  z-index: 2;
  width: 100%;
  padding: 2rem 1.5rem 3rem;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  max-width: var(--maxw);
  margin: 0 auto;
}

.slurp-hero-title {
  font-size: clamp(2.5rem, 8vw, 5rem);
  line-height: .95;
  text-transform: uppercase;
}

.slurp-hero-sub {
  text-align: right;
  font-size: 1rem;
  line-height: 1.6;
}

/* ---------- Sections ---------- */
.slurp-section {
  padding: 5rem 0;
}

.slurp-section-title {
  font-size: 1.1rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 2rem;
}

/* About */
.slurp-about {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: var(--gap);
}

.slurp-about-copy { font-size: 1.4rem; line-height: 1.3; }

.slurp-quotes {
  margin-top: 3rem;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 2rem;
  border-top: 1px solid var(--red-25);
  padding-top: 2rem;
}

.slurp-quotes-text { max-width: 32rem; font-size: .95rem; }

.slurp-quotes-author {
  display: flex;
  align-items: flex-end;
  gap: 1rem;
  text-align: right;
  font-size: .95rem;
}

.slurp-quotes-author img {
  width: 5.5rem;
  border-radius: .35em;
}

@media (max-width: 760px) {
  .slurp-about { grid-template-columns: 1fr; }
  .slurp-quotes { flex-direction: column; align-items: flex-start; }
  .slurp-quotes-author { text-align: left; }
}

/* Restaurants */
.slurp-locales {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
}

@media (max-width: 760px) {
  .slurp-locales { grid-template-columns: 1fr; }
}

.slurp-local video {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  border-radius: .35em;
  display: block;
}

.slurp-local-texto { margin-top: 1rem; }

.slurp-local-desc { margin-top: .75rem; font-size: .95rem; }

.slurp-local-tags {
  display: flex;
  gap: .5rem;
  flex-wrap: wrap;
  margin-top: .75rem;
}

.slurp-tag {
  border: 1px solid var(--red-25);
  border-radius: .35em;
  padding: .3em .7em;
  font-size: .8rem;
}

/* Behind the Bowl */
.slurp-behind-item {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2.5rem;
  align-items: start;
  padding: 2.5rem 0;
  border-top: 1px solid var(--red-25);
}

.slurp-behind-item:first-of-type { border-top: none; }

.slurp-behind-item h3 {
  font-size: 1.6rem;
  margin-bottom: 1rem;
}

.slurp-behind-item p { font-size: .95rem; }

.slurp-behind-item img { border-radius: .35em; }

@media (max-width: 760px) {
  .slurp-behind-item { grid-template-columns: 1fr; }
  .slurp-behind-item img { order: -1; }
}

/* ---------- Footer / Contact ---------- */
.slurp-footer {
  padding: 4rem 0 2rem;
  border-top: 1px solid var(--red-25);
}

.slurp-footer-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--gap);
}

@media (max-width: 900px) {
  .slurp-footer-grid { grid-template-columns: 1fr 1fr; }
}

@media (max-width: 560px) {
  .slurp-footer-grid { grid-template-columns: 1fr; }
}

.slurp-footer-col h4 {
  font-size: .95rem;
  text-transform: uppercase;
  letter-spacing: .04em;
  margin-bottom: 1rem;
}

.slurp-footer-item {
  font-size: .9rem;
  margin-bottom: .6rem;
}

.slurp-footer-link {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  font-size: .9rem;
  margin-bottom: .6rem;
  cursor: pointer;
  border-bottom: 1px solid transparent;
}

.slurp-footer-link:hover { border-color: var(--red); }

.slurp-dot {
  width: .4rem;
  height: .4rem;
  border-radius: 50%;
  background: var(--red);
  opacity: .5;
  flex: none;
}

/* FAQ accordion */
.slurp-faq-item { margin-bottom: .3rem; }

.slurp-faq-q {
  cursor: pointer;
  font-size: .9rem;
  display: flex;
  align-items: center;
  gap: .5rem;
  padding: .3rem 0;
}

.slurp-faq-a {
  max-height: 0;
  overflow: hidden;
  font-size: .85rem;
  opacity: .85;
  transition: max-height .3s ease, padding .3s ease;
}

.slurp-faq-item.is-open .slurp-faq-a {
  max-height: 20em;
  padding: .3rem 0 1rem;
}

/* Newsletter */
.slurp-newsletter-form {
  display: none;
  margin-top: .75rem;
  gap: .5rem;
}

.slurp-newsletter-form.is-open { display: flex; }

.slurp-newsletter-form input[type="email"] {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--red);
  color: var(--red);
  font-family: inherit;
  font-size: .9rem;
  padding: .3em 0;
}

.slurp-newsletter-form input[type="email"]::placeholder { color: var(--red-25); }

.slurp-newsletter-form button {
  background: none;
  border: 1px solid var(--red);
  border-radius: .35em;
  color: var(--red);
  font-family: inherit;
  font-size: .85rem;
  padding: .3em .8em;
  cursor: pointer;
}

.slurp-newsletter-msg {
  font-size: .8rem;
  margin-top: .5rem;
  display: none;
}

.slurp-newsletter-msg.is-visible { display: block; }

.slurp-footer-logos {
  display: flex;
  justify-content: center;
  margin: 3rem 0 2rem;
}

.slurp-footer-logos img { max-width: 14rem; }

.slurp-creditos {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
  font-size: .8rem;
  border-top: 1px solid var(--red-25);
  padding-top: 1.5rem;
}

.slurp-creditos-der {
  display: flex;
  align-items: center;
  gap: .4rem;
}

.slurp-creditos-der img { width: 1rem; }

/* ---------- Menu page ---------- */
.slurp-menu-hero {
  padding: 7rem 0 2rem;
  text-align: center;
}

.slurp-menu-hero h1 {
  font-size: clamp(2rem, 6vw, 3.2rem);
  text-transform: uppercase;
}

.slurp-menu-group { margin-bottom: 3.5rem; }

.slurp-menu-group-title {
  display: flex;
  align-items: center;
  gap: .6rem;
  font-size: 1.3rem;
  text-transform: uppercase;
  letter-spacing: .04em;
  border-bottom: 1px solid var(--red-25);
  padding-bottom: .75rem;
  margin-bottom: 1.25rem;
}

.slurp-menu-group-title img { width: 1.4rem; height: 1.4rem; }

.slurp-menu-item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 1rem;
  padding: 1rem 0;
  border-bottom: 1px dotted var(--red-25);
}

.slurp-menu-item:last-child { border-bottom: none; }

.slurp-menu-item-name {
  display: flex;
  align-items: baseline;
  gap: .6rem;
  flex-wrap: wrap;
  font-size: 1.05rem;
}

.slurp-menu-item-badge {
  font-size: .7rem;
  text-transform: uppercase;
  letter-spacing: .03em;
  border: 1px solid var(--red-25);
  border-radius: .3em;
  padding: .1em .5em;
  opacity: .8;
}

.slurp-menu-item-desc {
  font-size: .85rem;
  opacity: .85;
  margin-top: .3rem;
}

.slurp-menu-item-desc p { margin: 0 0 .2em; }

.slurp-menu-item-price {
  font-size: 1rem;
  white-space: nowrap;
  align-self: start;
}
</style>
