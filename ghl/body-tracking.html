<script>
(function () {
  var toggle = document.querySelector(".slurp-nav-toggle");
  var close = document.querySelector(".slurp-nav-close");
  var nav = document.querySelector(".slurp-nav");
  function openNav() {
    nav.classList.add("is-open");
    close.classList.add("is-open");
    document.documentElement.style.overflow = "hidden";
  }
  function closeNav() {
    nav.classList.remove("is-open");
    close.classList.remove("is-open");
    document.documentElement.style.overflow = "";
  }
  if (toggle) toggle.addEventListener("click", openNav);
  if (close) close.addEventListener("click", closeNav);
  if (nav) {
    nav.querySelectorAll("a").forEach(function (a) {
      a.addEventListener("click", closeNav);
    });
  }

  document.querySelectorAll(".slurp-faq-q").forEach(function (q) {
    q.addEventListener("click", function () {
      q.closest(".slurp-faq-item").classList.toggle("is-open");
    });
  });

  document.querySelectorAll(".slurp-newsletter-toggle").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var form = document.querySelector(btn.getAttribute("data-target"));
      if (form) form.classList.toggle("is-open");
    });
  });

  document.querySelectorAll(".slurp-newsletter-form").forEach(function (form) {
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var msg = form.parentElement.querySelector(".slurp-newsletter-msg");
      if (msg) {
        msg.textContent = "Thanks for signing up!";
        msg.classList.add("is-visible");
      }
      form.reset();
    });
  });
})();
</script>
